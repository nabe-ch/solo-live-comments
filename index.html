<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>ひとり配信コメント</title>
<link rel="stylesheet" href="style.css?v=202611040139">
</head>
<body>
<header>
  <button id="toggle" type="button">開始</button>
  <span id="status">停止中</span>
  <label>使い方
    <select id="mode">
      <option value="ask" selected>質問</option>
      <option value="stream">配信</option>
    </select>
  </label>
  <label id="amountLabel">量
    <select id="amount">
      <option value="0.5">少なめ</option>
      <option value="1" selected>普通</option>
      <option value="2">多め</option>
    </select>
  </label>
</header>
<ul id="chat" aria-live="off"></ul>
<footer>
  <details id="missed">
    <summary>答えられなかった質問（<span id="missedCount">0</span>）</summary>
    <ul id="missedList"></ul>
    <div class="missedActions"><button id="missedCopy" type="button">コピー</button><button id="missedClear" type="button">消す</button></div>
  </details>
  <p id="heard">聞き取った声がここに出ます</p>
  <form id="testForm">
    <input id="testInput" type="text" placeholder="試し入力（例：タランチュラいくら）" autocomplete="off">
    <button type="submit">送る</button>
  </form>
</footer>
